<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desenho Assinado</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importar o SDK do Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <main>
        <h1>Desenho Assinado</h1>
        
        <!-- O container para o botão de Login com o Google -->
        <!-- NOTA: Vais ter de substituir o 'SEU_CLIENT_ID_AQUI' pelo Client ID real que vais criar no Google Cloud Console depois -->
        <div id="g_id_onload"
             data-client_id="SEU_CLIENT_ID_AQUI.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>

        <form id="form-desenho">
            <label for="numero">Número (1 a 100):</label>
            <input type="number" id="numero" min="1" max="100" required>
            <button type="submit">Gerar Desenho</button>
        </form>

        <!-- Container para mensagens de erro -->
        <div id="mensagem-erro" style="color: red; margin-top: 10px;"></div>
        
        <!-- Container para exibir o SVG gerado -->
        <div id="container-svg"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
